# nf-core/rnaseq 3.21.0 parameters
# Dual-species alignment: Btru + Shae concatenated genome, STAR-Salmon
# Strandedness: reverse (RF) — confirmed by nf-core auto-detection
# BBsplit disabled — reads compete across both genomes simultaneously

## Input/Output
input:  "/temp180/mpfrende/nvincen2/NicloTemp/metadata/samplesheet.csv"
outdir: "/temp180/mpfrende/nvincen2/NicloTemp/02_alignment/nfcore_output"
multiqc_title: "NicloTemp_concatenated_genome_full"

## Reference
fasta: "/temp180/mpfrende/nvincen2/NicloTemp/Data/reference_data/Combined/combined.genome.fna"
gtf:   "/temp180/mpfrende/nvincen2/NicloTemp/Data/reference_data/Combined/combined.genome.gtf"

## Alignment
aligner:          "star_salmon"
skip_bbsplit:     true
save_reference:   true
save_align_intermeds: true
save_unaligned:   true

## QC modules to run
rseqc_modules: "bam_stat,inner_distance,infer_experiment,junction_annotation,junction_saturation,read_distribution,read_duplication"
