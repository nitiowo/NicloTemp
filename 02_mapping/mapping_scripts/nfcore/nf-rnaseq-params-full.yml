##     Type: string
## -----------------------------------------------------------------------------
# contaminant_screening: null

## -----------------------------------------------------------------------------
## kraken_db
## -----------------------------------------------------------------------------
##     Database when using Kraken2/Bracken for contaminant screening.
##     Type: string
## -----------------------------------------------------------------------------
# kraken_db: null

## -----------------------------------------------------------------------------
## bracken_precision
## -----------------------------------------------------------------------------
##     Taxonomic level for Bracken abundance estimations.
##     Type: string
## -----------------------------------------------------------------------------
# bracken_precision: "S"


## =============================================================================
